name: Build and Deploy Web Flasher

on:
  push:
    branches: [ "main" ] # Runs every time you push to main
  workflow_dispatch: # Adds a button to run it manually from the Actions tab

# Grants permissions needed to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Use the official ESP-IDF container (adjust release version if Bitle needs a specific one)
    container: espressif/idf:release-v5.1 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Important if Bitle uses submodules

      - name: Build ESP32-C3 Firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32c3
          idf.py build
          # Move binaries into a structure matching your manifest.json
          mkdir -p web-flasher/c3
          cp build/bootloader/bootloader.bin web-flasher/c3-bootloader.bin
          cp build/partition_table/partition-table.bin web-flasher/c3-partition-table.bin
          cp build/ota_data_initial.bin web-flasher/c3-ota_data_initial.bin
          cp build/bitle.bin web-flasher/c3-bitle.bin

      - name: Build ESP32-S3 Firmware
        run: |
          . /opt/esp/idf/export.sh
          rm -rf build # Clean previous build
          idf.py set-target esp32s3
          idf.py build
          mkdir -p web-flasher/s3
          cp build/bootloader/bootloader.bin web-flasher/s3-bootloader.bin
          cp build/partition_table/partition-table.bin web-flasher/s3-partition-table.bin
          cp build/ota_data_initial.bin web-flasher/s3-ota_data_initial.bin
          cp build/bitle.bin web-flasher/s3-bitle.bin

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Uploads the web-flasher folder containing the HTML, JSON, and newly compiled BINs
          path: './web-flasher' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
