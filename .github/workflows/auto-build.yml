name: Auto Build Bitle Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [esp32c3, esp32s3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware (${{ matrix.target }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: ${{ matrix.target }}
          path: '.'
          command: idf.py build

      - name: Prepare binaries
        run: |
          mkdir -p dist
          cp build/bootloader/bootloader.bin dist/bootloader-${{ matrix.target }}.bin
          cp build/partition_table/partition-table.bin dist/partition-table-${{ matrix.target }}.bin
          cp build/bitle.bin dist/bitle-${{ matrix.target }}.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: dist/

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-latest
          name: Bitle Firmware - Auto Build
          body: |
            Automatically built by the Bitle Node Flasher.
          prerelease: true
          make_latest: true
          files: firmware/*.bin
