name: Build and Deploy Web Flasher

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger the workflow

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build for ESP32-C3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32c3
          path: '.'
          command: idf.py build

      - name: Copy C3 Binaries
        run: |
          mkdir -p web-flasher/c3
          cp build/bootloader/bootloader.bin web-flasher/c3/
          cp build/partition_table/partition-table.bin web-flasher/c3/
          cp build/bitle.bin web-flasher/c3/

      # Clean the build directory before building for the next target
      - name: Clean Build Directory
        run: rm -rf build

      - name: Build for ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32s3
          path: '.'
          command: idf.py build

      - name: Copy S3 Binaries
        run: |
          mkdir -p web-flasher/s3
          cp build/bootloader/bootloader.bin web-flasher/s3/
          cp build/partition_table/partition-table.bin web-flasher/s3/
          cp build/bitle.bin web-flasher/s3/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
